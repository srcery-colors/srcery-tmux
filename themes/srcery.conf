# Theme Styling {{{

# Main Status Style
set -g status-style fg=$bright_white,bg=$gray1

# Left Statusline
set -g status-left-style fg=$bright_white,bg=$gray4
set -g status-left-length 40

# Right Statusline
# NOTE: fg must stay an indexed/named color here, not hex - tmux's
# right-flush padding for status-right silently breaks when
# status-right-style's fg is a truecolor hex value (tested on tmux 3.7b).
set -g status-right-style fg=brightwhite,bg=$gray1
set -g status-right-length 150

# Window Statusline
setw -g window-status-current-style fg=$bright_white,bg=$gray4,bold

setw -g window-status-style fg=$white,bg=$gray2

setw -g window-status-separator ""

setw -g window-status-activity-style fg=$bright_white,bg=$gray2
setw -g window-status-bell-style fg=$black,bg=$yellow

# Pane border
setw -g pane-border-style fg=$gray3,bg=default
setw -g pane-active-border-style fg=$white,bg=default

# Clock mode
setw -g clock-mode-colour $bright_white
setw -g clock-mode-style 24

# Command message
set -g message-command-style fg=$bright_white,bg=$gray4

# Mode Style
setw -g mode-style fg=$white,bold,bg=$blue

# Message
set -g message-style fg=$bright_white,bg=$gray4

# Pane number indicator
set -g display-panes-colour $gray5
set -g display-panes-active-colour $bright_white

# }}}
# Plugin settings {{{

# tmux-prefix-highlight
# TODO: Can script be validated
set -g @prefix_highlight_fg "$black"
set -g @prefix_highlight_bg "$bright_white"
set -g @prefix_highlight_show_copy_mode 'on'

# }}}

# vim: filetype=tmux:formatoptions-=t:
