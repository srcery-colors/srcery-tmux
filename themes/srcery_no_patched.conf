#
# This file contains the no font patched version of the statusbar.
#
########################################################################

# Palette Colors {{

black=#121110
red=#EF2F27
green=#519F50
yellow=#FBB829
blue=#2C78BF
magenta=#E02C6D
cyan=#0AAEB3
white=#C5B088
bright_black=#917E6B
bright_red=#F75341
bright_green=#98BC37
bright_yellow=#FED06E
bright_blue=#68A8E4
bright_magenta=#FF5C8F
bright_cyan=#2BE4D0
bright_white=#FCE8C3
bright_orange=#FF8700
gray1=#1C1B19
gray2=#262522
gray3=#312F2C
gray4=#3B3935
gray5=#45433E
gray6=#504D47

# }}}
# Theme Styling {{{

# Left Statusline
set -g status-left "#[fg=$bright_white,bg=$gray4,bold] #S #[fg=$bright_white,bg=$gray3] #I:#P #[fg=$bright_white,bg=$gray1,nobold,noitalics,nounderscore] "

# Right Statusline
set -g status-right "#{prefix_highlight}#[fg=$bright_white,bg=$gray3] %H:%M | %F #[fg=$bright_white,bg=$gray4,bold] #(whoami)@#h "

# Window Current Statusline
setw -g window-status-current-format " #I: #W (#F) "

# Window Statusline
setw -g window-status-format " #I: #W (#F) "

# }}}
# Plugin Settings {{{

# Tmux Prefix
set -g @prefix_highlight_copy_prompt "COPY"
set -g @prefix_highlight_copy_mode_attr "fg=$white,bold,bg=$blue"

# }}}

# vim: filetype=tmux:formatoptions-=t:
