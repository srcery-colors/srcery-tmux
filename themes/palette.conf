########################################################################
# File name: palette.conf
# Project: srcery color scheme for tmux
# Version: 2.0.0
# Copyright: Birger Johan Nordølum <me@mindtooth.no>
#
# This file defines the srcery color palette as tmux config-file
# variables.  tmux persists `name=value` assignments made while
# sourcing a config file in the server's global environment, so once
# this file has been sourced by srcery.tmux, these variables remain
# available (as $name expansions) to any config file sourced
# afterwards in the same invocation.
#
########################################################################

