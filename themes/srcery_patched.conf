#
# This file contains the font patched version of the statusbar.
#
########################################################################


# Theme Styling {{{

# Left Status
# #1 #2 ...
left_status_1="#[fg=$bright_white,bg=$gray4,bold] #S #[fg=$gray4,bg=$gray3,nobold,noitalics,nounderscore]"
left_status_2="#[fg=$bright_white,bg=$gray3] #I:#P #[fg=$gray3,bg=$gray1,nobold,noitalics,nounderscore]"
set -g status-left "$left_status_1$left_status_2"

# Right Status
# ... #3 #2 #1
right_status_1="#[fg=$gray4,bg=$gray3,nobold,noitalics,nounderscore]#[fg=$bright_white,bg=$gray4,bold] #(whoami)@#h"
right_status_2="#[fg=$gray3,bg=$gray1,nobold,noitalics,nounderscore]#[fg=$bright_white,bg=$gray3] %H:%M | %F"
right_status_3="#[fg=$bright_white,bg=$gray1]#{prefix_highlight}"
set -g status-right "$right_status_3$right_status_2 $right_status_1 "

# Current Window Statusline
current_window_status_1="#[fg=$gray1,bg=$gray4,nobold,noitalics,nounderscore]"
current_window_status_2="#[fg=$bright_white,bg=$gray4,bold,noitalics,nounderscore] #I: #W (#F) "
current_window_status_3="#[fg=$gray4,bg=$gray1,nobold,noitalics,nounderscore]"
setw -g window-status-current-format "$current_window_status_1$current_window_status_2$current_window_status_3"

# Window Statusline
window_status_1="#[fg=$gray1,bg=$gray2,nobold,noitalics,nounderscore]"
window_status_2="#[fg=$white,bg=$gray2,noitalics,nounderscore] #I: #W (#F) "
window_status_3="#[fg=$gray2,bg=$gray1,nobold,noitalics,nounderscore]"
setw -g window-status-format "$window_status_1$window_status_2$window_status_3"

# }}}
# Plugin Settings {{{

# Tmux Prefix
get_prefix="#(tmux show-option -gqv prefix | tr "[:lower:]" "[:upper:]" | sed 's/C-/\^/')"

set -g @prefix_highlight_prefix_prompt "#[fg=$bright_white]#[bg=$bright_orange]#[nobold]#[noitalics]#[nounderscore]#[fg=$bright_black]#[bg=$bright_white]#[bold] $get_prefix"
set -g @prefix_highlight_copy_prompt "#[fg=$blue]#[bg=$bright_orange]#[nobold]#[noitalics]#[nounderscore]#[fg=$white]#[bg=$blue]#[bold] COPY"


set -g @prefix_highlight_output_prefix "#[fg=$bright_orange]#[bg=$gray1]#[nobold]#[noitalics]#[nounderscore]"
set -g @prefix_highlight_output_suffix " #[fg=$bright_orange]#[nobold]#[noitalics]#[nounderscore]#[fg=$gray1]#[bg=$bright_orange]#[nobold]#[noitalics]#[nounderscore]"

# }}}

# vim: filetype=tmux:formatoptions-=t:
